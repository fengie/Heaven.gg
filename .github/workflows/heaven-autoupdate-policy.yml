name: Heaven AutoUpdate Contract

on:
  push:
    # Test the exact candidate branch as well as canonical main.
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven-autoupdate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows","X64","heaven-toolbox"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce automatic update contract
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: ./.github/scripts/Test-UpdatePolicy.ps1
      - name: Test policy scalar types
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: ./tests/Test-UpdatePolicyScalarTypes.ps1
