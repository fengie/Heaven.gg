name: Refresh Celtic Heroes catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-import.yml"
      - "ch_tables/catalog_ingest.py"

permissions:
  contents: read

concurrency:
  group: ch-catalog-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'fengie/Heaven.gg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify local extraction tests before network I/O
        run: python -m unittest tests.test_catalog_ingest -v
      - name: Fetch pinned public JSON data safely
        run: python -m ch_tables.catalog_ingest --output data/catalog
      - name: Generate compact item examples and field-key inventory
        run: |
          python -m unittest tests.test_catalog_report -v
          python -m ch_tables.catalog_report
      - name: Inspect manifest
        run: |
          python -c "import json; x=json.load(open('data/catalog/catalog_manifest.json')); print('selected=', x['selected_relevant_items'], 'total=',x['total_unique_items'], 'missing=',x['missing_terms'])"
      - name: Prepare exact public-data patch
        run: python -m ch_tables.generated_publication prepare catalog --bundle "$RUNNER_TEMP/generated-catalog"
      - name: Transfer bounded same-run data patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-catalog
          path: ${{ runner.temp }}/generated-catalog/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.repository == 'fengie/Heaven.gg' && github.ref == 'refs/heads/main'
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact trusted generator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Receive only this run's public-data patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-catalog
          path: ${{ runner.temp }}/generated-catalog
      - name: Verify bounded patch and publish only against unchanged main
        run: python -m ch_tables.generated_publication publish catalog --bundle "$RUNNER_TEMP/generated-catalog"
