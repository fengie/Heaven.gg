name: Import full public game data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-game-import.yml"
      - "ch_tables/full_game_ingest.py"
      - "tests/test_full_game_ingest.py"
      - "ch_tables/gear_bonus_index.py"
      - "ch_tables/game_quality.py"

permissions:
  contents: read

concurrency:
  group: full-ch-factual-data-import
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'fengie/Heaven.gg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run offline source schema and preservation tests
        run: python -m unittest tests.test_full_game_ingest tests.test_catalog_ingest -v
      - name: Import all publicly source-pinned records
        run: python -m ch_tables.full_game_ingest --output data/game
      - name: Build exact all-gear skill and ability bonus index
        run: |
          python -m unittest tests.test_gear_bonus_index tests.test_game_query -v
          python -m ch_tables.gear_bonus_index --data data/game
      - name: Crosscheck item and mob ids and conflicting source records
        run: |
          python -m unittest tests.test_game_quality -v
          python -m ch_tables.game_quality --data data/game
      - name: Rebuild release states against the newly imported item IDs
        run: |
          python -m unittest tests.test_release_status -v
          python -m ch_tables.release_status --data data/game --evidence data/release/evidence.json
      - name: Verify generated file manifest and all gzip archives
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          p=Path("data/game"); m=json.loads((p/"manifest.json").read_text())
          for name, meta in m["generated_files"].items():
              content=(p/name).read_bytes()
              assert hashlib.sha256(content).hexdigest()==meta["sha256"],name
              if name.endswith(".gz"):
                  assert gzip.decompress(content),name
          assert m["counts"]["items"]>=10000
          assert m["counts"]["mobs"]>=100
          assert m["counts"]["combat_mobs"]>=100
          print("VALIDATED",m["counts"])
          PY
      - name: Prepare exact public-data patch
        run: python -m ch_tables.generated_publication prepare game --bundle "$RUNNER_TEMP/generated-game"
      - name: Transfer bounded same-run data patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-game
          path: ${{ runner.temp }}/generated-game/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.repository == 'fengie/Heaven.gg' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact trusted generator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Receive only this run's public-data patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-game
          path: ${{ runner.temp }}/generated-game
      - name: Verify bounded patch and publish only against unchanged main
        run: python -m ch_tables.generated_publication publish game --bundle "$RUNNER_TEMP/generated-game"
