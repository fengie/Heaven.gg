name: Collect Codex skill observations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-skill-import.yml"
      - "ch_tables/codex_skill_ingest.py"

permissions:
  contents: read

concurrency:
  group: codex-skill-reference
  cancel-in-progress: false

jobs:
  harvest:
    if: github.repository == 'fengie/Heaven.gg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline format checks
        run: python -m unittest tests.test_codex_skill_ingest -v
      - name: Collect public skill panels responsibly
        run: python -m ch_tables.codex_skill_ingest
      - name: Prepare exact public-data patch
        run: python -m ch_tables.generated_publication prepare codex --bundle "$RUNNER_TEMP/generated-codex"
      - name: Transfer bounded same-run data patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-codex
          path: ${{ runner.temp }}/generated-codex/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.repository == 'fengie/Heaven.gg' && github.ref == 'refs/heads/main'
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact trusted generator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Receive only this run's public-data patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-codex
          path: ${{ runner.temp }}/generated-codex
      - name: Verify bounded patch and publish only against unchanged main
        run: python -m ch_tables.generated_publication publish codex --bundle "$RUNNER_TEMP/generated-codex"
