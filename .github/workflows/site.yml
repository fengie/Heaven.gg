name: Heaven.gg Website

on:
  push:
    branches: [main, feat/web002-evidence-wardrobe-20261009]
    paths:
      - 'web/**'
      - 'apps/aion2-value-atlas/**'
      - 'data/reference/codex_published_build_catalog.json'
      - 'data/reference/raid_boss_resistances_2026_10_08.json'
      - 'data/catalog/priority_gear_lookup.json'
      - 'package.json'
      - '.github/workflows/site.yml'
      - '.heaven/update-policy.json'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'apps/aion2-value-atlas/**'
      - 'data/reference/codex_published_build_catalog.json'
      - 'data/reference/raid_boss_resistances_2026_10_08.json'
      - 'data/catalog/priority_gear_lookup.json'
      - 'package.json'
      - '.github/workflows/site.yml'
      - '.heaven/update-policy.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven-gg-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify exact source and build static website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify browser source and data contracts
        run: npm run test:web
      - name: Generate static website from this exact commit
        run: npm run build
      - name: Check deployed artifact identity
        shell: bash
        run: |
          node -e "const f=require('./dist/version.json'); if(f.revision!==process.env.GITHUB_SHA || f.repository!=='fengie/Heaven.gg') process.exit(1);"
          test -s dist/index.html
          test -s dist/aion2/index.html
          test -s dist/ch/catalog.json
      # Candidate artifacts are inspectable, never evidence of a deployed site.
      - name: Upload tested Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages from verified main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish exact tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
