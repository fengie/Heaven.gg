name: Heaven.gg Website

on:
  push:
    branches: [main, feat/web002-evidence-wardrobe-20261009]
    paths:
      - 'web/**'
      - 'ch_tables/**'
      - 'tests/**'
      - 'apps/aion2-value-atlas/**'
      - 'data/reference/codex_published_build_catalog.json'
      - 'data/reference/raid_boss_resistances_2026_10_08.json'
      - 'data/catalog/priority_gear_lookup.json'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/site.yml'
      - '.heaven/update-policy.json'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'ch_tables/**'
      - 'tests/**'
      - 'apps/aion2-value-atlas/**'
      - 'data/reference/codex_published_build_catalog.json'
      - 'data/reference/raid_boss_resistances_2026_10_08.json'
      - 'data/catalog/priority_gear_lookup.json'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/site.yml'
      - '.heaven/update-policy.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven-gg-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify exact source and build static website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Capture exact tracked source for independent audit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=tar --output="$RUNNER_TEMP/heaven-gg-source.tar" "$GITHUB_SHA"
          git ls-tree -rz --full-tree "$GITHUB_SHA" > "$RUNNER_TEMP/heaven-gg-tree.bin"
      - name: Preserve source audit snapshot separately from deployable assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/heaven-gg-source.tar
            ${{ runner.temp }}/heaven-gg-tree.bin
          retention-days: 7
          if-no-files-found: error
      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify browser source and data contracts
        run: npm run test:web
      - name: Generate static website from this exact commit
        run: npm run build
      - name: Package portable research beta
        run: node web/offline.mjs
      - name: Prepare isolated browser acceptance runtime
        shell: bash
        run: |
          command -v google-chrome
          python3 -m venv "$RUNNER_TEMP/heaven-browser"
          "$RUNNER_TEMP/heaven-browser/bin/python" -m pip install playwright==1.57.0
      - name: Verify actual browser interactions on the exact portable artifact
        shell: bash
        run: |
          "$RUNNER_TEMP/heaven-browser/bin/python" web/tests/browser-smoke.py \
            --artifact dist/Heaven.gg-Research-Beta.html \
            --output "$RUNNER_TEMP/browser-evidence" \
            --browser-executable "$(command -v google-chrome)"
      - name: Preserve browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/browser-evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Check deployed artifact identity
        shell: bash
        run: |
          node -e "const f=require('./dist/version.json'); if(f.revision!==process.env.GITHUB_SHA || f.repository!=='fengie/Heaven.gg') process.exit(1);"
          test -s dist/index.html
          test -s dist/aion2/index.html
          test -s dist/ch/catalog.json
          test -s dist/Heaven.gg-Research-Beta.html
      # Candidate artifacts are inspectable, never evidence of a deployed site.
      - name: Upload tested Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages from verified main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish exact tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
